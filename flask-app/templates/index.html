<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 DQN - Deep Reinforcement Learning</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Clear+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="title">2048 DQN</h1>
            <div class="subtitle">Deep Reinforcement Learning Agent</div>
        </header>

        <!-- Game Controls -->
        <div class="controls-section">
            <div class="model-controls">
                <div class="model-input-group">
                    <label for="model-path">Model Directory:</label>
                    <input type="text" id="model-path" placeholder="Model/" value="Model/">
                    <button id="load-model-btn" class="btn btn-primary">Load Model</button>
                </div>
                <div class="model-status" id="model-status">No model loaded</div>
            </div>

            <div class="game-controls">
                <div class="control-group">
                    <button id="reset-btn" class="btn btn-secondary">🔄 Reset Game</button>
                    <button id="manual-mode-btn" class="btn btn-mode active">🎮 Manual Play</button>
                    <button id="auto-mode-btn" class="btn btn-mode">🤖 Auto Play</button>
                </div>
                
                <div class="auto-controls" id="auto-controls" style="display: none;">
                    <button id="auto-step-btn" class="btn btn-auto">Single Step</button>
                    <button id="auto-play-btn" class="btn btn-auto">Start Auto</button>
                    <button id="auto-stop-btn" class="btn btn-auto" style="display: none;">Stop Auto</button>
                </div>
            </div>
        </div>

        <!-- Game Board -->
        <div class="game-container">
            <!-- Game Stats - Vertical on Left -->
            <div class="stats-section">
                <div class="stat-box">
                    <div class="stat-label">SCORE</div>
                    <div class="stat-value" id="score">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">BEST TILE</div>
                    <div class="stat-value" id="max-tile">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">MOVES</div>
                    <div class="stat-value" id="moves">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">AI ε</div>
                    <div class="stat-value" id="epsilon">—</div>
                </div>
            </div>
            
            <div class="game-board" id="game-board">
                <!-- Board will be generated by JavaScript -->
            </div>
            
            <!-- Manual Controls -->
            <div class="manual-controls" id="manual-controls">
                <div class="controls-grid">
                    <div></div>
                    <button class="control-btn" data-direction="up">↑</button>
                    <div></div>
                    <button class="control-btn" data-direction="left">←</button>
                    <button class="control-btn center-btn" disabled>2048</button>
                    <button class="control-btn" data-direction="right">→</button>
                    <div></div>
                    <button class="control-btn" data-direction="down">↓</button>
                    <div></div>
                </div>
                <div class="controls-hint">
                    Use arrow keys or buttons above
                </div>
            </div>
        </div>

        <!-- Game History -->
        <div class="history-section">
            <div class="history-header">
                <h3>Move History</h3>
                <button id="clear-history-btn" class="btn btn-small">Clear</button>
            </div>
            <div class="history-content" id="history-content">
                <div class="history-empty">No moves yet...</div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='game.js') }}"></script>
</body>
</html>
